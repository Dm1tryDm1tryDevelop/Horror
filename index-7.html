<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Гусиная Ферма</title>
<style>
  :root{
    --ui-blue-1:#bfe9ff;
    --ui-blue-2:#5fb7e8;
    --ui-blue-3:#2f8fc4;
    --ui-dark:#1c3a4a;
    --coin:#ffcf3f;
    --coin-dark:#b8860b;
    --panel-bg: linear-gradient(180deg,#eaf8ff 0%, #cdeeff 60%, #a9dcf5 100%);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#0a1a22;
    font-family: 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
    touch-action: none;
  }
  #gameWrap{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#0a1a22;
  }
  #stage{
    position:relative;
    width:100%; height:100%;
    max-width: 720px;
    margin:0 auto;
    overflow:hidden;
    background:#8fd6f5;
  }
  canvas#game{
    position:absolute; left:0; top:0;
    width:100%; height:100%;
    display:block;
  }
  /* ---------- Top bar ---------- */
  #topBar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: env(safe-area-inset-top,8px) 8px 0 8px;
    pointer-events:none;
    z-index: 20;
  }
  #topLeftCol{ display:flex; flex-direction:column; gap:6px; pointer-events:auto; }
  .pill{
    pointer-events:auto;
    background: var(--panel-bg);
    border:2px solid #ffffffaa;
    box-shadow: 0 3px 0 #6fa8c9, 0 4px 8px rgba(0,0,0,0.25);
    border-radius: 999px;
    display:flex; align-items:center; gap:5px;
    padding:5px 10px;
    font-weight:700;
    color: var(--ui-dark);
    font-size:13px;
    white-space:nowrap;
  }
  #coinPill{font-size:16px; padding:6px 14px;}
  .coinIcon{
    width:18px; height:18px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff5b0, var(--coin) 55%, var(--coin-dark) 100%);
    display:inline-block; box-shadow: inset 0 0 2px #8a6200;
    flex-shrink:0;
  }
  #waterPill{cursor:pointer; transition:box-shadow .2s;}
  #waterPill.ready{ box-shadow: 0 3px 0 #d8a838, 0 0 10px 2px #ffdf7f, 0 4px 8px rgba(0,0,0,0.25); }
  .bucketDots{display:flex; gap:2px; margin-left:2px;}
  .bucketDots span{width:4px;height:10px;border-radius:1px;background:#dbeaf2;border:1px solid #9cc3d8;}
  .bucketDots span.filled{background:#3fa9e0; border-color:#1f7fae;}
  #shopRow{
    pointer-events:auto;
    display:flex; gap:6px;
  }
  .shopBtn{
    position:relative;
    width:52px; height:52px;
    border-radius: 16px;
    background: var(--panel-bg);
    border:2px solid #ffffffcc;
    box-shadow: 0 3px 0 #6fa8c9, 0 4px 8px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .shopBtn canvas{width:34px;height:34px;}
  .shopBtn .price{
    position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    background:var(--coin); color:#5c3d00; font-size:10px; font-weight:800;
    padding:1px 6px; border-radius:8px; border:1px solid #b8860b;
    white-space:nowrap;
  }
  .shopBtn.disabled{filter:grayscale(0.6) brightness(0.8); }
  .countBadge{
    position:absolute; top:-6px; right:-6px;
    background:#3fbf4f; color:#fff; min-width:16px;height:16px;border-radius:9px;
    font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
    border:1px solid #fff; padding:0 3px;
  }
  /* ---------- bottom bar ---------- */
  #bottomBar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding: 0 8px env(safe-area-inset-bottom,8px) 8px;
    pointer-events:none;
    z-index:20;
  }
  #menuBtn{
    pointer-events:auto;
    background: var(--panel-bg);
    border:2px solid #ffffffcc;
    box-shadow: 0 3px 0 #6fa8c9, 0 4px 8px rgba(0,0,0,0.25);
    border-radius: 999px;
    padding:8px 18px;
    font-weight:800;
    color:var(--ui-dark);
    font-size:14px;
  }
  #warehouseQuickBtn{cursor:pointer; display:flex; align-items:center; gap:6px;}
  #warehouseQuickBtn canvas{width:20px;height:20px;}
  /* ---------- floaters ---------- */
  .floater{
    position:absolute; pointer-events:none; z-index:30;
    display:flex; align-items:center; gap:3px;
    font-weight:800; font-size:14px; color:#ffdf5c;
    text-shadow: -1px 0 #7a4a00, 0 1px #7a4a00, 1px 0 #7a4a00, 0 -1px #7a4a00;
    animation: floatUp 1.1s ease-out forwards;
  }
  .floater canvas{width:22px;height:22px;}
  @keyframes floatUp{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(-46px); opacity:0; }
  }
  /* ---------- modals ---------- */
  .modalBg{
    position:absolute; inset:0; background:rgba(10,25,35,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .modalBg.show{opacity:1; pointer-events:auto;}
  .modal{
    width:92%; max-width:430px; max-height:82%;
    overflow-y:auto;
    background: var(--panel-bg);
    border:3px solid #ffffffcc;
    border-radius:22px;
    box-shadow:0 10px 0 #6fa8c9, 0 14px 30px rgba(0,0,0,0.4);
    padding:16px;
    transform: scale(0.9) translateY(10px);
    transition: transform .18s;
  }
  .modalBg.show .modal{ transform: scale(1) translateY(0); }
  .modalTitle{
    text-align:center; font-size:18px; font-weight:900; color:var(--ui-dark);
    margin:2px 0 12px 0;
    text-shadow:0 1px 0 #fff;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .modalTitle canvas{width:34px;height:34px;}
  .closeX{
    position:absolute; top:10px; right:16px;
    width:30px;height:30px;border-radius:50%;
    background:#ff6b6b; color:#fff; border:2px solid #fff;
    font-weight:900; font-size:16px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 2px 0 #b03a3a;
  }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background:#ffffffaa; border-radius:14px; padding:8px 10px; margin-bottom:8px;
    border:1px solid #ffffff;
  }
  .row .info{display:flex; align-items:center; gap:10px;}
  .row canvas{width:38px;height:38px;}
  .row .lbl{font-weight:700; color:var(--ui-dark); font-size:13px;}
  .row .sub{font-size:11px; color:#5a7c8c; font-weight:600;}
  .stepBtns{display:flex; align-items:center; gap:6px;}
  .stepBtn{
    width:30px;height:30px;border-radius:8px;
    background:var(--ui-blue-2); color:#fff; font-weight:900; font-size:16px;
    border:1px solid #2f7fae; box-shadow:0 2px 0 #2a6a90;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .stepBtn:active{transform:translateY(1px); box-shadow:none;}
  .qty{min-width:22px; text-align:center; font-weight:800; color:var(--ui-dark);}
  .capBarWrap{
    background:#ffffffaa; border-radius:10px; padding:4px 8px; margin-bottom:10px;
    border:1px solid #fff;
  }
  .capBar{height:14px; border-radius:8px; background:#dfeef7; overflow:hidden; border:1px solid #b7d6e6; display:flex;}
  .capBar > div{height:100%;}
  .capLabel{font-size:11px; font-weight:700; color:var(--ui-dark); margin-top:2px;}
  .bigBtn{
    width:100%; padding:12px; margin-top:6px;
    background: linear-gradient(180deg,#ffe27a,#ffbf3f);
    border:2px solid #cf9a1c; border-radius:14px;
    font-weight:900; font-size:16px; color:#5c3d00;
    box-shadow:0 3px 0 #b07d15;
    cursor:pointer;
  }
  .bigBtn:active{transform:translateY(2px); box-shadow:none;}
  .bigBtn:disabled{opacity:0.45; cursor:default;}
  .factCard{
    background:#ffffffaa; border-radius:14px; padding:10px; margin-bottom:10px; border:1px solid #fff;
  }
  .factHead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .factHead .lbl{font-weight:700; color:var(--ui-dark); font-size:13px;}
  .progWrap{height:10px; background:#dfeef7; border-radius:6px; overflow:hidden; border:1px solid #b7d6e6;}
  .progFill{height:100%; background:linear-gradient(90deg,#ffd35c,#ff9d3f); width:0%;}
  #toast{
    position:absolute; left:50%; bottom:70px; transform:translateX(-50%);
    background:rgba(20,40,50,0.92); color:#fff; padding:9px 18px; border-radius:12px;
    font-size:13px; font-weight:700; z-index:60; opacity:0; transition:opacity .25s;
    pointer-events:none; text-align:center; max-width:80%;
  }
  #toast.show{opacity:1;}
  #startScreen{
    position:absolute; inset:0; z-index:100;
    background: radial-gradient(circle at 50% 30%, #bdf0ff, #6fc4e8 70%, #3f9fce);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#0f3550;
  }
  #startScreen h1{
    font-size:36px; margin:0 0 4px 0; color:#ffffff;
    text-shadow: 0 3px 0 #2a7a49, 0 5px 10px rgba(0,0,0,0.3);
    letter-spacing:1px;
  }
  #startScreen .sub{font-size:14px; font-weight:700; margin-bottom:22px; color:#0f3550;}
  #startBtn{
    padding:16px 46px; font-size:20px; font-weight:900;
    background: linear-gradient(180deg,#8ff08f,#3fbf4f);
    border:3px solid #2c8f3a; border-radius:20px; color:#fff;
    box-shadow:0 5px 0 #2c8f3a, 0 8px 16px rgba(0,0,0,0.3);
    cursor:pointer;
  }
  #startBtn:active{transform:translateY(3px); box-shadow:0 2px 0 #2c8f3a;}
  #startScreen canvas{margin-bottom:10px;}
  .muteBtn{
    position:absolute; top:calc(env(safe-area-inset-top,8px) + 108px); left:8px;
    width:38px;height:38px; border-radius:50%;
    background:var(--panel-bg); border:2px solid #fff; box-shadow:0 3px 0 #6fa8c9;
    display:flex; align-items:center; justify-content:center;
    z-index:21; pointer-events:auto; cursor:pointer;
  }
  .muteBtn canvas{width:22px;height:22px;}
</style>
</head>
<body>
<div id="gameWrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="startScreen">
      <canvas id="startGooseCanvas" width="160" height="160"></canvas>
      <h1>Гусиная Ферма</h1>
      <div class="sub">Растите гусей, собирайте яйца,<br>ловите мишек-хулиганов и стройте своё хозяйство!</div>

    <div id="topBar">

      <div class="modal" style="position:relative;">
        <div class="closeX" id="whClose">✕</div>

        <div class="capBarWrap">
          <div class="capBar" id="whCapFill"></div>
          <div class="capLabel" id="whCapLabel">0/20 мест</div>
        </div>
        <div id="whRows"></div>
        <button class="bigBtn" id="whUpgradeBtn">Расширить склад</button>
      </div>
    </div>

    <!-- Factory modal -->
    <div class="modalBg" id="factModalBg">
      <div class="modal" style="position:relative;">
        <div class="closeX" id="factClose">✕</div>

    <!-- Buy confirm modal -->
    <div class="modalBg" id="buyModalBg">
      <div class="modal" style="position:relative; text-align:center;">
        <div class="closeX" id="buyClose">✕</div>
        <div class="modalTitle" id="buyTitle">Купить?</div>
        <div id="buyDesc" style="font-size:13px; color:#2a4a5c; font-weight:600; margin-bottom:12px;"></div>
        <button class="bigBtn" id="buyConfirmBtn">Купить</button>

    <!-- Menu modal -->
    <div class="modalBg" id="menuModalBg">
      <div class="modal" style="position:relative; text-align:center;">
        <div class="closeX" id="menuClose">✕</div>
        <div class="modalTitle">Меню</div>
        <button class="bigBtn" id="soundToggleBtn">Звук: Вкл</button>
        <button class="bigBtn" id="resetBtn" style="background:linear-gradient(180deg,#ff9a9a,#e85555); border-color:#a83a3a; color:#fff;">Начать заново</button>
      </div>

  </div>
</div>

<script>
'use strict';
/* =========================================================================
   ГУСИНАЯ ФЕРМА — единый файл: canvas-рендер, процедурная графика, звук
   ========================================================================= */

/* ---------------------------------------------------------------------
   AUDIO
--------------------------------------------------------------------- */
const Audio_ = (function(){
  let ctx = null;
  let enabled = true;
  function ensure(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, delay, glideTo){
    if(!enabled) return;
    const c = ensure(); if(!c) return;
    const t0 = c.currentTime + (delay||0);
    const osc = c.createOscillator(); const gain = c.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noise(dur, vol, delay, filterFreq){
    if(!enabled) return;
    const c = ensure(); if(!c) return;
    const t0 = c.currentTime + (delay||0);
    const bufferSize = Math.max(1,Math.floor(c.sampleRate * dur));
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize,1.5);
    const src = c.createBufferSource(); src.buffer = buffer;
    const filt = c.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = filterFreq||1200;
    const gain = c.createGain(); gain.gain.setValueAtTime(vol||0.2, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    src.connect(filt); filt.connect(gain); gain.connect(c.destination);
    src.start(t0); src.stop(t0+dur+0.02);
  }
  return {
    setEnabled(v){ enabled = v; },
    isEnabled(){ return enabled; },
    unlock(){ ensure(); },
    click(){ tone(520,0.06,'square',0.10,0,420); },
    pop(){ tone(660,0.08,'sine',0.16,0,880); },
    coin(){ tone(1046,0.09,'triangle',0.18,0); tone(1568,0.12,'triangle',0.14,0.06); },
    coinBig(){ tone(784,0.09,'triangle',0.2,0); tone(1046,0.09,'triangle',0.2,0.05); tone(1568,0.16,'triangle',0.2,0.11); },
    quack(){ tone(340,0.10,'sawtooth',0.14,0,220); tone(300,0.08,'sawtooth',0.10,0.09,190); },
    eggPop(){ tone(900,0.05,'sine',0.15,0,1300); },
    splash(){ noise(0.28,0.18,0,900); tone(300,0.15,'sine',0.06,0.02,180); },
    pump(){ tone(220,0.09,'square',0.09,0,300); },
    growl(){ noise(0.35,0.16,0,320); tone(120,0.3,'sawtooth',0.1,0,90); },
    cageClank(){ tone(200,0.05,'square',0.15,0,150); noise(0.08,0.12,0,3000); },
    cageBreak(){ noise(0.4,0.22,0,2500); tone(150,0.3,'sawtooth',0.12,0,60); },
    engine(){ noise(0.5,0.10,0,220); tone(90,0.5,'sawtooth',0.09,0,140); },
    build(){ tone(500,0.07,'square',0.12,0); tone(700,0.07,'square',0.12,0.08); tone(900,0.09,'square',0.12,0.16); },
    bark(){ tone(180,0.09,'square',0.18,0,120); tone(160,0.09,'square',0.16,0.12,110); },
    meow(){ tone(500,0.12,'sine',0.13,0,700); },
    error(){ tone(180,0.15,'square',0.13,0,120); },
    fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.16,i*0.09)); },
    thud(){ tone(70,0.2,'sine',0.22,0,45); noise(0.16,0.16,0,260); },
  };
})();
document.addEventListener('pointerdown', ()=>Audio_.unlock(), {once:true});

/* ---------------------------------------------------------------------
   CANVAS / VIEWPORT
--------------------------------------------------------------------- */
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 720, H = 1280;
let dpr = Math.max(1, window.devicePixelRatio||1);
let scaleX=1, scaleY=1;
function resize(){
  const rect = stage.getBoundingClientRect();
  canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
  dpr = Math.max(1, window.devicePixelRatio||1);
  canvas.width = Math.round(rect.width*dpr); canvas.height = Math.round(rect.height*dpr);
  scaleX = canvas.width / W; scaleY = canvas.height / H;
}
window.addEventListener('resize', resize);
resize();
function pointerToWorld(clientX, clientY){
  const rect = stage.getBoundingClientRect();
  return { x: ((clientX-rect.left)/rect.width)*W, y: ((clientY-rect.top)/rect.height)*H };
}
function worldToScreen(x,y){
  const rect = stage.getBoundingClientRect();
  return { x: rect.left + (x/W)*rect.width, y: rect.top + (y/H)*rect.height };
}

/* ---------------------------------------------------------------------
   UTIL
--------------------------------------------------------------------- */
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }
function lerp(a,b,t){ return a+(b-a)*t; }
function fmt(n){ return Math.floor(n).toLocaleString('ru-RU'); }
function pick(arr){ return arr[randi(0,arr.length-1)]; }

function toast(msg, ms){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), ms||1500);
}
function floatIcon(worldX, worldY, iconType, text, color){
  const s = worldToScreen(worldX, worldY);
  const d = document.createElement('div');
  d.className='floater';
  if(iconType){
    const c = document.createElement('canvas'); c.width=44; c.height=44;
    drawIcon(c, iconType);
    d.appendChild(c);
  }
  if(text){
    const span = document.createElement('span');
    span.textContent = text;
    if(color) span.style.color = color;
    d.appendChild(span);
  }
  d.style.left = (s.x-12)+'px'; d.style.top = (s.y-12)+'px';
  document.getElementById('stage').appendChild(d);
  setTimeout(()=>d.remove(), 1150);
}
function floatCoins(worldX, worldY, amount){
  const s = worldToScreen(worldX, worldY);
  const d = document.createElement('div');
  d.className='floater';
  d.innerHTML = '<span class="coinIcon" style="width:16px;height:16px;"></span><span>+'+fmt(amount)+'</span>';
  d.style.left = (s.x-14)+'px'; d.style.top = (s.y-12)+'px';
  document.getElementById('stage').appendChild(d);
  setTimeout(()=>d.remove(), 1150);
}

/* ---------------------------------------------------------------------
   GAME STATE
--------------------------------------------------------------------- */
const SAVE_KEY = 'goose_farm_save_v3';

const state = {
  coins: 250,
  geese: [],
  bears: [],
  groundEggs: [],
  water: 0,
  wellReady: false,
  pumping: false,
  grassPatches: [],

function roundRectPath(c, x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawStar(c,x,y,r1,r2,points){
  c.save(); c.translate(x,y); c.beginPath();
  for(let i=0;i<points*2;i++){ const r = i%2===0?r1:r2; const a = Math.PI*i/points; c.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  c.closePath(); c.fill(); c.restore();
}

function drawGoose(c, s, walkPhase, dirX){
  c.save(); c.scale(dirX,1);
  const bob = Math.sin(walkPhase)*2*s;
  const legSwing = Math.sin(walkPhase)*6*s;
  c.save(); c.globalAlpha=0.22; c.fillStyle='#000';
  c.beginPath(); c.ellipse(0, 20*s, 17*s, 6*s, 0,0,Math.PI*2); c.fill(); c.restore();
  c.strokeStyle='#e08a2b'; c.lineWidth=3*s; c.lineCap='round';
  c.beginPath(); c.moveTo(-4*s, 8*s+bob); c.lineTo(-4*s+legSwing, 20*s); c.stroke();
  c.beginPath(); c.moveTo(4*s, 8*s+bob); c.lineTo(4*s-legSwing, 20*s); c.stroke();
  c.fillStyle='#e08a2b';
  c.beginPath(); c.ellipse(-4*s+legSwing,20.5*s,4*s,1.6*s,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(4*s-legSwing,20.5*s,4*s,1.6*s,0,0,Math.PI*2); c.fill();
  const grad = c.createRadialGradient(-4*s,-2*s+bob,2*s, 0,4*s+bob,22*s);
  grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#e7edf0');
  c.fillStyle = grad;
  c.beginPath(); c.ellipse(0, 6*s+bob, 15*s, 12*s, 0,0,Math.PI*2); c.fill();
  c.strokeStyle='#c9d3d6'; c.lineWidth=1; c.stroke();
  c.fillStyle='#dde5e8';
  c.beginPath(); c.ellipse(-2*s, 7*s+bob, 8*s, 6*s, 0.3, 0, Math.PI*2); c.fill();
  c.fillStyle='#ffffff';
  c.beginPath();
  c.moveTo(8*s, -2*s+bob);
  c.quadraticCurveTo(15*s,-14*s+bob, 13*s,-20*s+bob);
  c.quadraticCurveTo(20*s,-22*s+bob, 22*s,-16*s+bob);
  c.quadraticCurveTo(18*s,-8*s+bob, 12*s, 2*s+bob);
  c.closePath(); c.fill();
  c.strokeStyle='#c9d3d6'; c.lineWidth=1; c.stroke();
  c.fillStyle='#f5a623';
  c.beginPath(); c.moveTo(20*s,-17*s+bob); c.lineTo(27*s,-15.5*s+bob); c.lineTo(20*s,-13.5*s+bob); c.closePath(); c.fill();
  c.fillStyle='#e6484f';
  c.beginPath(); c.ellipse(16*s,-15.5*s+bob,2.6*s,2*s,0,0,Math.PI*2); c.fill();
  c.fillStyle='#2a2a2a';
  c.beginPath(); c.arc(18*s,-19*s+bob,1.6*s,0,Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(18.5*s,-19.5*s+bob,0.6*s,0,Math.PI*2); c.fill();
  c.restore();
}

function drawEgg(c,s){
  // Realistic, clearly elongated egg silhouette (rounded top, tapered bottom) — NOT a circle.
  c.save(); c.scale(s,s);
  const W=6.2;      // half-width at the widest point
  const topH=8.4;   // widest point to the rounded top
  const botH=10.2;  // widest point to the tapered bottom (longer, so it isn't round)
  c.save(); c.globalAlpha=0.16; c.fillStyle='#000';
  c.beginPath(); c.ellipse(0,botH+1.6,W*0.8,2.4,0,0,Math.PI*2); c.fill(); c.restore();
  const grad = c.createRadialGradient(-W*0.4,-topH*0.5,1.2, 0,-topH*0.15,(topH+botH)*0.75);
  grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.55,'#fbf6e6'); grad.addColorStop(1,'#e2d0a0');
  c.fillStyle = grad;
  c.beginPath();
  c.moveTo(0,-topH);
  c.bezierCurveTo(W*0.7,-topH, W,-topH*0.5, W,0);
  c.bezierCurveTo(W,botH*0.58, W*0.42,botH, 0,botH);
  c.bezierCurveTo(-W*0.42,botH, -W,botH*0.58, -W,0);
  c.bezierCurveTo(-W,-topH*0.5, -W*0.7,-topH, 0,-topH);
  c.closePath(); c.fill();
  c.strokeStyle='rgba(200,180,130,0.55)'; c.lineWidth=Math.max(0.5,0.35); c.stroke();
  c.fillStyle='rgba(255,255,255,0.8)';
  c.beginPath(); c.ellipse(-W*0.32,-topH*0.15, W*0.24, topH*0.42, -0.25, 0, Math.PI*2); c.fill();
  c.fillStyle='rgba(255,255,255,0.35)';
  c.beginPath(); c.ellipse(W*0.3,botH*0.25, W*0.16, botH*0.3, 0.2, 0, Math.PI*2); c.fill();
  c.restore();
}

function drawCakeIcon(c,s){
  c.save(); c.scale(s,s);
  c.globalAlpha=0.15; c.fillStyle='#000';
  c.beginPath(); c.ellipse(0,21,14,4.6,0,0,Math.PI*2); c.fill(); c.globalAlpha=1;
  // fluted paper wrapper (trapezoid with zigzag bottom edge)
  const wrapTop=2, wrapBot=19, halfW=12;
  const wrapGrad = c.createLinearGradient(-halfW,wrapTop,halfW,wrapBot);
  wrapGrad.addColorStop(0,'#f0a874'); wrapGrad.addColorStop(1,'#d97a3f');
  c.fillStyle=wrapGrad;
  c.beginPath();
  c.moveTo(-halfW*0.68, wrapTop);
  const flutes=7;
  for(let i=0;i<=flutes;i++){
    const t=i/flutes; const x=lerp(-halfW,halfW,t); const y= i%2===0? wrapBot : wrapBot-3.4;
    c.lineTo(x,y);
  }
  c.lineTo(halfW*0.68, wrapTop); c.closePath(); c.fill();

  // sprinkles
  const sprinkleColors=['#e6484f','#3fae3f','#3f9fce','#ffb43f','#c05fd0'];
  [[-4.5,-5],[3.5,-7],[-1.5,0],[5,-1],[0.5,-12],[-4,-14],[2,-17]].forEach((p,i)=>{
    c.strokeStyle=sprinkleColors[i%sprinkleColors.length]; c.lineWidth=1.6; c.lineCap='round';

    c.restore();
  });
  // cherry on top
  const cherryGrad = c.createRadialGradient(-1,-19.5,0.5,0,-18.5,3);
  cherryGrad.addColorStop(0,'#ff7a72'); cherryGrad.addColorStop(1,'#c0272d');
  c.fillStyle=cherryGrad;
  c.beginPath(); c.arc(0,-18.5,2.6,0,Math.PI*2); c.fill();
  c.fillStyle='rgba(255,255,255,0.6)';
  c.beginPath(); c.arc(-1,-19.4,0.7,0,Math.PI*2); c.fill();
  c.strokeStyle='#5a7a3a'; c.lineWidth=1.2; c.lineCap='round';
  c.beginPath(); c.moveTo(0,-20.8); c.lineTo(1.8,-23.6); c.stroke();
  c.beginPath(); c.ellipse(2.6,-24.2,1.6,1,0.5,0,Math.PI*2); c.fillStyle='#5a9a3a'; c.fill();

function drawBear(c, s, walkPhase, cageStage, alert_){
  c.save();
  const frozen = cageStage>=6;
  const bob = frozen ? 0 : Math.sin(walkPhase)*1.6*s;
  const legSwing = frozen ? 0 : Math.sin(walkPhase)*5*s;
  c.save(); c.globalAlpha=0.25; c.fillStyle='#000';
  c.beginPath(); c.ellipse(0,34*s,22*s,7*s,0,0,Math.PI*2); c.fill(); c.restore();
  c.fillStyle='#6b4a2f';
  c.beginPath(); c.ellipse(-9*s+legSwing,26*s+bob,6*s,9*s,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(9*s-legSwing,26*s+bob,6*s,9*s,0,0,Math.PI*2); c.fill();
  const bg = c.createRadialGradient(-6*s,-6*s+bob,4*s,0,4*s+bob,28*s);
  bg.addColorStop(0,'#a97a4d'); bg.addColorStop(1,'#7c5330');
  c.fillStyle=bg;
  c.beginPath(); c.ellipse(0,6*s+bob,20*s,18*s,0,0,Math.PI*2); c.fill();
  c.fillStyle='#c9a26b';
  c.beginPath(); c.ellipse(0,10*s+bob,11*s,12*s,0,0,Math.PI*2); c.fill();
  c.fillStyle='#7c5330';
  c.beginPath(); c.ellipse(-18*s,2*s+bob,6*s,10*s,0.3,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(18*s,2*s+bob,6*s,10*s,-0.3,0,Math.PI*2); c.fill();
  c.fillStyle='#8a5f39';
  c.beginPath(); c.ellipse(0,-16*s+bob,13*s,12*s,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(-9*s,-26*s+bob,4.4*s,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(9*s,-26*s+bob,4.4*s,0,Math.PI*2); c.fill();
  c.fillStyle='#b98a5e';
  c.beginPath(); c.arc(-9*s,-26*s+bob,2.2*s,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(9*s,-26*s+bob,2.2*s,0,Math.PI*2); c.fill();
  c.fillStyle='#c9a26b';
  c.beginPath(); c.ellipse(0,-11*s+bob,7*s,6*s,0,0,Math.PI*2); c.fill();
  c.fillStyle='#3a2a1a';
  c.beginPath(); c.ellipse(0,-12*s+bob,1.8*s,1.4*s,0,0,Math.PI*2); c.fill();
  c.strokeStyle='#2a1a0a'; c.lineWidth=1.4*s; c.fillStyle='#2a1a0a';
  const eyeY = -19*s+bob;
  c.beginPath(); c.arc(-5*s,eyeY,1.5*s,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(5*s,eyeY,1.5*s,0,Math.PI*2); c.fill();
  if(alert_){
    c.beginPath(); c.moveTo(-8*s,eyeY-3*s); c.lineTo(-2*s,eyeY-1*s); c.stroke();

  }
  if(cageStage>0) drawCageOverlay(c, s, cageStage);
  c.restore();
}

function drawCageOverlay(c, s, stage){
  c.save(); c.strokeStyle = '#8a6a3a'; c.lineWidth = 3.6*s; c.lineCap='round';
  const positions = [ [-22,-32,-22,34],[-13,-38,-13,38],[-4,-40,-4,40],[4,-40,4,40],[13,-38,13,38],[22,-32,22,34] ];
  for(let i=0;i<stage;i++){ const p = positions[i]; c.beginPath(); c.moveTo(p[0]*s,p[1]*s); c.lineTo(p[2]*s,p[3]*s); c.stroke(); }
  if(stage>=2){ c.lineWidth=3*s; c.beginPath(); c.moveTo(-24*s,-24*s); c.lineTo(24*s,-24*s); c.stroke(); }
  if(stage>=4){ c.beginPath(); c.moveTo(-24*s,0); c.lineTo(24*s,0); c.stroke(); }
  if(stage>=6){
    c.beginPath(); c.moveTo(-24*s,28*s); c.lineTo(24*s,28*s); c.stroke();
    c.fillStyle='#5a3f1e'; c.beginPath(); c.arc(0,0,3.4*s,0,Math.PI*2); c.fill();
  }
  c.restore();
}

  c.fillStyle='#f2e0c0';

function drawGrassPatch(c, patch){
  // Small round tuft of grass springing from a little circle of watered earth (no beds/rectangles),
  // and always fully grown the instant it's planted.
  c.save(); c.translate(patch.x, patch.y);
  const R = 30;
  c.fillStyle = 'rgba(110,80,52,0.4)';
  c.beginPath(); c.ellipse(0,4,R,R*0.62,0,0,Math.PI*2); c.fill();
  c.fillStyle = 'rgba(90,65,42,0.3)';
  c.beginPath(); c.ellipse(0,4,R*0.7,R*0.42,0,0,Math.PI*2); c.fill();
  const bladeCount = 16;
  for(let i=0;i<bladeCount;i++){
    const ang = (i/bladeCount)*Math.PI*2 + (patch.id||0);
    const bx = Math.cos(ang)*(R*0.15+(i%4)*4);
    const by = Math.sin(ang)*(R*0.09+(i%3)*2)+2;
    const bladeH = 13 + (i%3)*4;
    const sway = Math.sin(performance.now()/450 + i)*2.4;
    c.strokeStyle = i%2===0? '#5fae3f':'#3f8f2a';
    c.lineWidth=2.3; c.lineCap='round';
    c.beginPath();
    c.moveTo(bx,by+3);
    c.quadraticCurveTo(bx+sway*0.6, by+3-bladeH*0.6, bx+sway*1.1, by+3-bladeH);
    c.stroke();
  }
  // remaining "bites" shown as small pale seed-heads
  c.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<patch.amount;i++){
    const ang = -Math.PI/2 + (i-1)*0.55;
    c.save(); c.translate(Math.cos(ang)*14, -14+Math.sin(ang)*4); c.scale(0.5,0.5);
    c.fillStyle='#f2f8cf';
    c.beginPath(); c.ellipse(0,0,2.6,4,0,0,Math.PI*2); c.fill();
    c.restore();
  }
  c.restore();
}

function drawTruckBody(c, level, trunkOpen){
  const p = TRUCK_SPEC[level];
  c.save();
  // ground shadow
  c.globalAlpha=0.18; c.fillStyle='#000';
  c.beginPath(); c.ellipse(-8, p.wheelY+p.wheelR+6, p.bodyW*0.62, 9, 0,0,Math.PI*2); c.fill(); c.globalAlpha=1;

  // chassis / rear bed platform
  c.fillStyle=p.body;
  roundRectPath(c,p.bodyX,p.bodyY,p.bodyW,p.bodyH,8); c.fill();
  c.strokeStyle=p.bodyDark; c.lineWidth=2.2; roundRectPath(c,p.bodyX,p.bodyY,p.bodyW,p.bodyH,8); c.stroke();

  // low bed side-wall (open cargo well, visible whether covered or not)
  c.fillStyle=p.bed;
  roundRectPath(c,p.bedX,p.bedY,p.bedW,p.bedH,6); c.fill();
  c.strokeStyle=p.bodyDark; c.lineWidth=1.6; roundRectPath(c,p.bedX,p.bedY,p.bedW,p.bedH,6); c.stroke();

  // cab
  c.fillStyle=p.cab;
  roundRectPath(c,p.cabX,p.cabY,p.cabW,p.cabH,9); c.fill();
  c.strokeStyle=p.cabDark; c.lineWidth=2.2; roundRectPath(c,p.cabX,p.cabY,p.cabW,p.cabH,9); c.stroke();
  // windshield
  c.fillStyle=p.window;
  roundRectPath(c,p.wsX,p.wsY,p.wsW,p.wsH,5); c.fill();
  c.strokeStyle=p.cabDark; c.lineWidth=1.4; roundRectPath(c,p.wsX,p.wsY,p.wsW,p.wsH,5); c.stroke();
  // door seam + handle
  const doorX = p.cabX+p.cabW*0.78;
  c.strokeStyle=p.cabDark; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(doorX, p.cabY+4); c.lineTo(doorX, p.bodyY-2); c.stroke();
  c.fillStyle=p.cabDark;
  c.beginPath(); c.ellipse(doorX-4, p.bodyY-10, 3,1.6,0,0,Math.PI*2); c.fill();
  // side mirror
  c.fillStyle=p.cabDark;
  roundRectPath(c,p.cabX+2,p.wsY+2,4,7,2); c.fill();

  // hood (front nose, lower than cab roofline)
  c.fillStyle=p.body;
  roundRectPath(c,p.hoodX,p.hoodY,p.hoodW,p.hoodH,6); c.fill();
  c.strokeStyle=p.bodyDark; c.lineWidth=2; roundRectPath(c,p.hoodX,p.hoodY,p.hoodW,p.hoodH,6); c.stroke();
  // grille
  c.strokeStyle=p.bodyDark; c.lineWidth=1.3;
  for(let i=0;i<3;i++){ const gy=p.hoodY+3+i*4; c.beginPath(); c.moveTo(p.hoodX+p.hoodW-2,gy); c.lineTo(p.hoodX+p.hoodW+3,gy); c.stroke(); }
  // headlight
  c.fillStyle='#fff6c8';
  c.beginPath(); c.arc(p.headX,p.headY,p.headR,0,Math.PI*2); c.fill();
  c.strokeStyle=p.bodyDark; c.lineWidth=1; c.stroke();
  // front bumper — a proper wide chrome bar spanning the whole nose, not a tiny nub
  const bumpW = p.hoodW+18, bumpH=10;
  const bumpX = p.hoodX-6, bumpY = p.bodyY+p.bodyH-7;
  const bumpGrad = c.createLinearGradient(0,bumpY,0,bumpY+bumpH);
  bumpGrad.addColorStop(0,'#eef1f3'); bumpGrad.addColorStop(1,'#98a0a4');
  c.fillStyle=bumpGrad;
  roundRectPath(c,bumpX,bumpY,bumpW,bumpH,4); c.fill();
  c.strokeStyle='#565e62'; c.lineWidth=1.6; roundRectPath(c,bumpX,bumpY,bumpW,bumpH,4); c.stroke();
  c.strokeStyle='rgba(255,255,255,0.7)'; c.lineWidth=1;
  c.beginPath(); c.moveTo(bumpX+3,bumpY+2.5); c.lineTo(bumpX+bumpW-3,bumpY+2.5); c.stroke();
  // rear tail light
  c.fillStyle='#e6484f';
  roundRectPath(c,p.bodyX-2,p.bodyY+4,4,9,2); c.fill();

  // bed cover tarp when trunk is closed
  if(!trunkOpen){
    c.fillStyle=p.cabDark;
    c.globalAlpha=0.9;
    roundRectPath(c,p.bedX,p.bedY-8,p.bedW,10,5); c.fill();
    c.globalAlpha=1;

  // level 3 racing stripe for a bit of flair
  if(level===3){
    c.fillStyle='#ffd35c';
    c.fillRect(p.bodyX, p.bodyY+p.bodyH-8, p.bodyW+2, 4);
  }
  c.restore();
}
function drawTruckWheels(c, level, wheelSpin){
  const p = TRUCK_SPEC[level];
  function wheel(x,y,r){
    c.save(); c.translate(x,y); c.rotate(wheelSpin);
    c.fillStyle='#2a2a2a'; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.fillStyle='#999'; c.beginPath(); c.arc(0,0,r*0.42,0,Math.PI*2); c.fill();
    c.fillStyle='#666'; c.beginPath(); c.arc(0,0,r*0.14,0,Math.PI*2); c.fill();
    c.strokeStyle='#555'; c.lineWidth=1.8;
    for(let i=0;i<5;i++){ c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(i*Math.PI*0.4)*r*0.85, Math.sin(i*Math.PI*0.4)*r*0.85); c.stroke(); }
    c.restore();
  }
  wheel(-p.wheelX*0.62, p.wheelY, p.wheelR);
  wheel(p.wheelX, p.wheelY, p.wheelR);
}
const BED_RECT = { 1:{x:-56,y:-8,w:56,h:16}, 2:{x:-62,y:-12,w:68,h:18}, 3:{x:-68,y:-14,w:78,h:22} };
function drawTruckCargo(c, cargo, level, trunkOpen){
  if(!trunkOpen) return;
  const rect = BED_RECT[level];

  // Bears ride sitting up in the bed — big enough to actually read as a bear, not a brown blob.
  if(cargo.bears>0){
    const bCount = Math.min(cargo.bears,2);
    for(let i=0;i<bCount;i++){
      const bx = rect.x + rect.w*0.24 + i*20;
      const by = rect.y + rect.h*0.55;
      c.save(); c.translate(bx,by); c.scale(0.66,0.66);
      drawSittingBear(c,1);
      c.restore();
    }
    if(cargo.bears>2){
      c.fillStyle='#5c3d00'; c.font='bold 10px sans-serif'; c.textAlign='center';
      c.fillText('+'+(cargo.bears-2), rect.x+rect.w*0.24+40, rect.y+rect.h*0.55);
    }
  }

  // Everything else sits in a small tidy stack toward the tailgate.
  const items=[];
  for(let i=0;i<cargo.eggs;i++) items.push('egg');
  for(let i=0;i<cargo.powder;i++) items.push('powder');
  for(let i=0;i<cargo.cake;i++) items.push('cake');
  if(items.length===0) return;
  const gridX = cargo.bears>0 ? rect.x+rect.w*0.62 : rect.x+rect.w*0.5;
  const cols=3;
  items.slice(0,6).forEach((type,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const ix = gridX + col*13;
    const iy = rect.y + 8 + row*13;
    c.save(); c.translate(ix,iy); c.scale(0.4,0.4);
    if(type==='egg') drawEgg(c,3);
    else if(type==='powder') drawPowderIcon(c,1);
    else if(type==='cake') drawCakeIcon(c,1);
    c.restore();
  });
  if(items.length>6){
    c.fillStyle='#5c3d00'; c.font='bold 10px sans-serif'; c.textAlign='center';
    c.fillText('+'+(items.length-6), rect.x+rect.w-6, rect.y+rect.h-2);
  }
}

    c.strokeStyle='#8a9096'; c.lineWidth=1.6; c.stroke();
    // small vent pipe on cap
    c.fillStyle='#9aa2a6'; c.fillRect(siloX-2,siloTop-22,4,8);
    // chute connecting silo to shed roof

    c.beginPath(); c.moveTo(siloX,siloBot); c.lineTo(-14,-14); c.stroke();

      for(let k=0;k<3;k++){

    c.restore();
    c.strokeStyle='#8a5a2a'; c.lineWidth=2.2; roundRectPath(c,-40,-16,80,50,8); c.stroke();
    // pitched roof with tile texture
    c.fillStyle='#a83b3b';
    c.beginPath(); c.moveTo(-48,-16); c.lineTo(48,-16); c.lineTo(34,-42); c.lineTo(-34,-42); c.closePath(); c.fill();
    c.strokeStyle='#7a2323'; c.lineWidth=2; c.stroke();
    c.strokeStyle='rgba(120,30,30,0.4)'; c.lineWidth=1;
    for(let rx=-40;rx<44;rx+=8){ c.beginPath(); c.moveTo(rx,-16); c.lineTo(rx*0.72,-40); c.stroke(); }
    // chimney
    c.fillStyle='#8a5a3a'; c.fillRect(18,-58,9,20);
    c.strokeStyle='#5a3a1e'; c.lineWidth=1.4; c.strokeRect(18,-58,9,20);
    if(producing){
      for(let k=0;k<3;k++){
        const tt = ((performance.now()/800)+k*0.33)%1;
        c.globalAlpha = 0.55*(1-tt);
        c.fillStyle='#fff';
        c.beginPath(); c.ellipse(22.5, -58-tt*22, 4+tt*6, 4+tt*5, 0,0,Math.PI*2); c.fill();
      }
      c.globalAlpha=1;
    }
    // oven window glowing warmly
    c.fillStyle='#3a2418'; c.beginPath(); c.arc(-16,6,11,0,Math.PI*2); c.fill();
    const ovenGrad = c.createRadialGradient(-16,6,1,-16,6,9);
    ovenGrad.addColorStop(0,'#fff2b0'); ovenGrad.addColorStop(0.6,'#ffb43f'); ovenGrad.addColorStop(1,'#c85a1e');
    c.fillStyle=ovenGrad;
    c.beginPath(); c.arc(-16,6,9,0,Math.PI*2); c.fill();
    c.strokeStyle='#5a3a1e'; c.lineWidth=2.4; c.beginPath(); c.arc(-16,6,11,0,Math.PI*2); c.stroke();
    // door
    c.fillStyle='#6b4a2f'; roundRectPath(c,10,10,18,24,4); c.fill();
    c.strokeStyle='#4a3320'; c.lineWidth=1.6; roundRectPath(c,10,10,18,24,4); c.stroke();
    c.fillStyle='#f2d9a8'; c.beginPath(); c.arc(19,20,5,Math.PI,Math.PI*2); c.fill();
    // awning over the door
    c.fillStyle='#c0403f';
    c.beginPath(); c.moveTo(6,10); c.lineTo(32,10); c.lineTo(30,2); c.lineTo(8,2); c.closePath(); c.fill();
    c.save(); c.beginPath(); c.moveTo(6,10); c.lineTo(32,10); c.lineTo(30,2); c.lineTo(8,2); c.closePath(); c.clip();
    c.fillStyle='#f2f2ec';
    for(let ax=6;ax<32;ax+=6){ c.fillRect(ax,2,3,9); }
    c.restore();
    // scalloped awning edge
    c.fillStyle='#c0403f';
    for(let ax=8;ax<31;ax+=4.6){ c.beginPath(); c.arc(ax,10,2.4,0,Math.PI); c.fill(); }
    // hanging sign with a little cupcake on it (no text, just the icon)
    c.strokeStyle='#5a3a1e'; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(-34,-16); c.lineTo(-34,-26); c.stroke();
    c.fillStyle='#f2e4c4'; roundRectPath(c,-44,-30,20,16,3); c.fill();
    c.strokeStyle='#8a5a2a'; c.lineWidth=1.4; roundRectPath(c,-44,-30,20,16,3); c.stroke();
    c.save(); c.translate(-34,-22); c.scale(0.62,0.62); drawCakeIcon(c,1); c.restore();
  }
  if(producing){
    c.save(); c.translate(0,-76);

    c.strokeStyle='#ffb43f'; c.lineWidth=5; c.lineCap='round';
    c.beginPath(); c.arc(0,0,12,-Math.PI/2, -Math.PI/2+prog*Math.PI*2); c.stroke();
    c.restore();
  }
  c.restore();
}
function drawFactoryOutputCluster(c, type){
  const f = state.factories[type];
  if(!f.built || f.output<=0) return;
  const spot = type==='powder'? LAYOUT.factPowderSpot : LAYOUT.factBakerySpot;
  const baseX = spot.x-55, baseY = spot.y+15;
  const count = Math.min(f.output,4);
  for(let i=0;i<count;i++){
    const ox=(i%2)*16-8, oy=Math.floor(i/2)*14-6;
    c.save(); c.translate(baseX+ox, baseY+oy); c.scale(0.6,0.6);
    if(type==='powder') drawPowderIcon(c,1); else drawCakeIcon(c,1);
    c.restore();
  }
  if(f.output>4){
    c.fillStyle='#5c3d00'; c.font='bold 11px sans-serif'; c.textAlign='center';
    c.fillText('+'+(f.output-4), baseX, baseY+30);
  }
}

function drawFence(){
  ctx.save();
  ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=6; ctx.lineCap='round';
  const cx=LAYOUT.fieldCenter.x, cy=LAYOUT.fieldCenter.y-LAYOUT.fieldRY-14;
  for(let x=60;x<W-40;x+=44){ ctx.beginPath(); ctx.moveTo(x, cy+18); ctx.lineTo(x, cy-10); ctx.stroke(); }
  ctx.strokeStyle='#a5835a'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(50,cy); ctx.lineTo(W-50,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(50,cy+12); ctx.lineTo(W-50,cy+12); ctx.stroke();
  ctx.restore();
}
function drawCloud(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(255,255,255,0.9)';
  [[0,0,28],[26,6,22],[-26,8,20],[10,-10,18]].forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],p[2],0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}
let decorSeeds = null;
function drawDecor(){
  if(!decorSeeds){
    decorSeeds=[];
    for(let i=0;i<26;i++){
      const a = rand(0,Math.PI*2), rr = rand(LAYOUT.fieldRX+20, LAYOUT.fieldRX+90);
      decorSeeds.push({ x: LAYOUT.fieldCenter.x+Math.cos(a)*rr, y: LAYOUT.fieldCenter.y+Math.sin(a)*rr*(LAYOUT.fieldRY/LAYOUT.fieldRX), type: pick(['rock','flowerY','flowerW','tuft']) });
    }
  }
  decorSeeds.forEach(d=>{
    if(d.y<190||d.y>H-10||d.x<10||d.x>W-10) return;
    ctx.save(); ctx.translate(d.x,d.y);
    if(d.type==='rock'){
      ctx.fillStyle='#9a9488'; ctx.beginPath(); ctx.ellipse(0,0,9,6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#b3ada0'; ctx.beginPath(); ctx.ellipse(-2,-2,4,2.6,0,0,Math.PI*2); ctx.fill();
    } else if(d.type==='tuft'){
      ctx.strokeStyle='#3f8f2a'; ctx.lineWidth=2;
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*2,4); ctx.lineTo(i*2.5,-8); ctx.stroke(); }
    } else {
      ctx.fillStyle = d.type==='flowerY'? '#ffd35c':'#fff';
      for(let i=0;i<5;i++){ const a=i*Math.PI*2/5; ctx.beginPath(); ctx.ellipse(Math.cos(a)*3,Math.sin(a)*3,2.6,2,0,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle='#e8b93f'; ctx.beginPath(); ctx.arc(0,0,1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}
function drawBackground(){
  const skyGrad = ctx.createLinearGradient(0,0,0,260);
  skyGrad.addColorStop(0,'#8fd6f5'); skyGrad.addColorStop(1,'#bfeaff');
  ctx.fillStyle = skyGrad; ctx.fillRect(0,0,W,260);
  drawCloud(120,80,1); drawCloud(520,60,0.8); drawCloud(340,130,0.6);
  ctx.fillStyle = '#5fae3f'; ctx.fillRect(0,180,W,H-180);
  for(let i=0;i<14;i++){ ctx.fillStyle = i%2===0? 'rgba(255,255,255,0.05)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,180+i*80,W,80); }
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(LAYOUT.fieldCenter.x, LAYOUT.fieldCenter.y, LAYOUT.fieldRX, LAYOUT.fieldRY, 0,0,Math.PI*2);
  const dirtGrad = ctx.createRadialGradient(LAYOUT.fieldCenter.x,LAYOUT.fieldCenter.y-100,60,LAYOUT.fieldCenter.x,LAYOUT.fieldCenter.y,LAYOUT.fieldRX);
  dirtGrad.addColorStop(0,'#e3c9a0'); dirtGrad.addColorStop(1,'#cba876');
  ctx.fillStyle = dirtGrad; ctx.fill();
  ctx.restore();
  drawDecor(); drawFence();
}

/* ---------------------------------------------------------------------
   ICON RENDERING (shared by floaters, UI rows, modal titles)
--------------------------------------------------------------------- */
function drawIconShape(ic, type){
  if(type==='egg') drawEgg(ic,3.2);
  else if(type==='bear') drawBear(ic,0.9,0,0,0);
  else if(type==='goose') drawGoose(ic,1.15,1.2,1);
  else if(type==='dog') drawDog(ic,1.6,1.2,1);
  else if(type==='cat') drawCat(ic,1.7,1.2,1);
  else if(type==='powder') drawPowderIcon(ic,1);
  else if(type==='cake') drawCakeIcon(ic,1);
  else if(type==='water') drawWaterDropIcon(ic,1.3);
  else if(type==='grass') drawGrassTuftIcon(ic,1.3);
  else if(type==='truck'){ ic.save(); ic.scale(0.32,0.32); ic.translate(0,26); drawTruckBody(ic,1,false); drawTruckWheels(ic,1,0); ic.restore(); }
  else if(type==='warehouse'){ ic.save(); ic.scale(0.32,0.32); ic.translate(0,26); drawWarehouse(ic,1); ic.restore(); }
}
function drawIcon(canvasEl, type){
  const ic = canvasEl.getContext('2d');
  ic.clearRect(0,0,canvasEl.width,canvasEl.height);
  ic.save();
  const offsets = {egg:0,bear:10,goose:10,dog:10,cat:10,powder:0,cake:0,water:0,grass:0,truck:0,warehouse:0};
  ic.translate(canvasEl.width/2, canvasEl.height/2+(offsets[type]||0));
  drawIconShape(ic, type);
  ic.restore();
}

/* ---------------------------------------------------------------------
   PARTICLES: tumble (death) and dust (landing)
--------------------------------------------------------------------- */
let tumbles = [];
function spawnGooseTumble(x,y){ tumbles.push({x,y,vx:rand(-40,40),vy:-180,rot:0,life:0}); }
function updateTumbles(dt){
  for(let i=tumbles.length-1;i>=0;i--){
    const t=tumbles[i]; t.life+=dt; t.vy += 260*dt; t.x += t.vx*dt; t.y+=t.vy*dt; t.rot += dt*14;
    if(t.life>1.4) tumbles.splice(i,1);
  }
}
function drawTumbles(){
  tumbles.forEach(t=>{
    ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.rot);
    ctx.globalAlpha = clamp(1-t.life/1.4,0,1);
    drawGoose(ctx,0.9,t.life*10,1);
    ctx.restore();
  });
}
let dustParticles = [];
function spawnLandingDust(x,y){
  for(let i=0;i<9;i++) dustParticles.push({x,y,vx:rand(-70,70),vy:rand(-50,-10),life:0,maxLife:rand(0.4,0.7)});
}
function updateDust(dt){
  for(let i=dustParticles.length-1;i>=0;i--){
    const p=dustParticles[i]; p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt;
    if(p.life>p.maxLife) dustParticles.splice(i,1);
  }
}
function drawDust(){
  dustParticles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=clamp(1-p.life/p.maxLife,0,1)*0.5;
    ctx.fillStyle='#c9a26b'; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

/* ---------------------------------------------------------------------
   GEESE
--------------------------------------------------------------------- */
function spawnGoose(){
  state.geese.push({
    x: LAYOUT.fieldCenter.x + rand(-160,160),
    y: LAYOUT.fieldCenter.y + rand(-200,240),
    tx:0, ty:0, dirX:1, walkPhase: rand(0,6), speed: rand(18,30),
    wanderT: rand(0.5,3), eggTimer: rand(22,32),
    hunger: 100, eatTimer: 0, dead:false, sitTimer:0,
  });
  state.gooseCount++;
}
function findNearestGrownPatch(x,y){
  let best=null, bestD=Infinity;
  state.grassPatches.forEach(p=>{
    if(p.amount>0){ const d=dist(x,y,p.x,p.y); if(d<bestD){bestD=d;best=p;} }
  });
  return best;
}
function updateGoose(g, dt){
  g.walkPhase += dt*4.2*((g.speed||24)/24);
  g.hunger -= dt*(100/140);
  if(g.hunger<=0){ g.dead=true; return; }
  const hungry = g.hunger<=50;
  if(hungry){
    const target = findNearestGrownPatch(g.x,g.y);
    if(target){
      const tx = target.x+rand(-14,14), ty=target.y+rand(-8,8);
      const dx=tx-g.x, dy=ty-g.y, d=Math.hypot(dx,dy)||1;
      const spd = (g.speed||24)*1.7;
      if(d>10){ g.x+=(dx/d)*spd*dt; g.y+=(dy/d)*spd*dt; g.dirX=dx<0?-1:1; }
      else {
        g.eatTimer += dt;
        if(g.eatTimer>0.9){
          g.eatTimer=0; target.amount--; g.hunger=100; Audio_.pop();
          floatIcon(target.x,target.y-30,'grass',null);
          if(target.amount<=0) state.grassPatches = state.grassPatches.filter(p=>p!==target);
        }
      }
      return;
    }
    // hungry but no food: anxious wander (fallthrough to normal movement below)
  }
  g.wanderT -= dt;
  if(g.wanderT<=0 || (Math.abs(g.x-g.tx)<4 && Math.abs(g.y-g.ty)<4)){
    const a = rand(0,Math.PI*2), r = rand(20,190);
    g.tx = clamp(LAYOUT.fieldCenter.x + Math.cos(a)*r, 90, W-90);
    g.ty = clamp(LAYOUT.fieldCenter.y + Math.sin(a)*r*0.9, 230, H-140);
    g.wanderT = rand(1.4,3.6);
  }
  const dx = g.tx-g.x, dy=g.ty-g.y, d = Math.hypot(dx,dy)||1;
  if(d>3){ g.x += (dx/d)*(g.speed||24)*dt; g.y += (dy/d)*(g.speed||24)*dt; g.dirX = dx<0?-1:1; }
  if(!hungry){
    g.eggTimer -= dt;
    if(g.eggTimer<=0){ g.eggTimer = rand(22,32); layEgg(g); }
  }
}
function layEgg(g){
  if(state.groundEggs.length >= 16) return;
  // The goose sits and lays the egg right where she's standing.
  state.groundEggs.push({x:g.x, y:g.y+16, id:Math.random()});
  g.sitTimer = 0.6; // brief pause animation while she lays it
  Audio_.eggPop();
}
function collectGroundEgg(egg){
  const cap = warehouseCap(); const used = warehouseUsed();
  if(used+SLOT_COST.egg>cap){ toast('Склад полон!'); Audio_.error(); return; }
  state.groundEggs = state.groundEggs.filter(e=>e!==egg);
  state.warehouse.eggs++;
  Audio_.coin();
  floatIcon(egg.x, egg.y-20, 'egg', null);
}
function drawHungerBar(x,y,hunger){
  ctx.save(); ctx.translate(x,y);
  const w=26,h=4;
  ctx.fillStyle='rgba(0,0,0,0.25)'; roundRectPath(ctx,-w/2,0,w,h,2); ctx.fill();
  const pct=clamp(hunger/100,0,1);
  ctx.fillStyle = hunger>50? '#7fd77f' : hunger>20? '#ffb43f' : '#e6484f';
  roundRectPath(ctx,-w/2,0,w*pct,h,2); ctx.fill();
  ctx.restore();
}

/* ---------------------------------------------------------------------
   BEARS
--------------------------------------------------------------------- */
function spawnBear(){
  if(state.bears.length>=1) return;
  const landX = clamp(LAYOUT.fieldCenter.x+rand(-180,180), 90, W-90);
  const landY = clamp(LAYOUT.fieldCenter.y+rand(-140,260), 300, H-200);
  state.bears.push({
    x: landX, y: -100, landY: landY, falling:true, fallVel:0,
    dirX: Math.random()<0.5?1:-1, walkPhase: rand(0,6),
    speed: rand(26,36), baseSpeed:0, wanderT:0,
    cageStage:0, caged:false, cageTimer:0, heldByDog:false,
    life:0, id: Math.random(),
  });
  const b = state.bears[state.bears.length-1];
  b.baseSpeed = b.speed;
}
function updateBear(b, dt){
  b.life += dt;
  if(b.falling){
    b.fallVel += 900*dt; b.y += b.fallVel*dt;
    if(b.y>=b.landY){ b.y=b.landY; b.falling=false; spawnLandingDust(b.x,b.y); Audio_.thud(); }
    return;
  }
  b.walkPhase += dt*3.4*(b.speed/28);
  if(b.caged){
    b.cageTimer -= dt;
    if(b.cageTimer<=0){ state.bears = state.bears.filter(x=>x!==b); Audio_.cageBreak(); floatIcon(b.x,b.y-30,null,'Сбежал!','#ff6b6b'); }
    return;
  }
  if(b.heldByDog){ return; }
  b.wanderT -= dt;
  if(b.wanderT<=0){
    const a = rand(0,Math.PI*2), r = rand(40,220);
    b.tx = clamp(LAYOUT.fieldCenter.x + Math.cos(a)*r, 60, W-60);
    b.ty = clamp(LAYOUT.fieldCenter.y + Math.sin(a)*r*0.9, 260, H-160);
    b.wanderT = rand(1.6,3.2);
  }
  const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy)||1;
  if(d>4){ b.x += (dx/d)*b.speed*dt; b.y += (dy/d)*b.speed*dt; b.dirX = dx<0?-1:1; }
  for(let i=state.geese.length-1;i>=0;i--){
    const g = state.geese[i];
    if(dist(b.x,b.y-6,g.x,g.y)<26){
      state.geese.splice(i,1); spawnGooseTumble(g.x,g.y); Audio_.growl(); break;
    }
  }
}
function bearTap(b){
  if(b.caged || b.falling) return;
  b.cageStage++;
  b.speed = b.baseSpeed * (1 - b.cageStage*0.15);
  Audio_.cageClank();
  floatIcon(b.x, b.y-40, null, b.cageStage+'/6', '#ffd35c');
  if(b.cageStage>=6){
    b.caged = true; b.speed = 0; b.cageTimer = 10; b.heldByDog=false;
    Audio_.fanfare();
  }
}
function collectBear(b){
  const need = SLOT_COST.bear;
  const used = warehouseUsed(); const cap = CAP_PER_LEVEL[state.warehouse.capLevel];
  if(used+need>cap){ toast('Склад переполнен!'); Audio_.error(); return; }
  state.warehouse.bears++;
  state.bears = state.bears.filter(x=>x!==b);
  floatIcon(b.x,b.y-30,'bear','+1');
  Audio_.coinBig();
}

/* ---------------------------------------------------------------------
   WAREHOUSE HELPERS
--------------------------------------------------------------------- */
function warehouseUsed(){
  const w = state.warehouse;
  return w.eggs*SLOT_COST.egg + w.bears*SLOT_COST.bear + w.powder*SLOT_COST.powder + w.cake*SLOT_COST.cake;
}
function warehouseCap(){ return CAP_PER_LEVEL[state.warehouse.capLevel]; }
function depositToWarehouse(type){
  if(type==='egg') state.warehouse.eggs++;
  else if(type==='powder') state.warehouse.powder++;
  else if(type==='cake') state.warehouse.cake++;
}

/* ---------------------------------------------------------------------
   DOG / CAT AI
--------------------------------------------------------------------- */
function makeCompanion(){
  return { x: LAYOUT.fieldCenter.x+rand(-100,100), y: LAYOUT.fieldCenter.y+rand(-100,100),
    tx:0,ty:0, dirX:1, walkPhase:rand(0,6), speed:rand(30,44), wanderT:0, mode:'wander', carrying:null, targetBearId:null, pickupTarget:null };
}
function wanderMove(o,dt,speedMul){
  o.wanderT -= dt;
  if(o.wanderT<=0){
    const a=rand(0,Math.PI*2), r=rand(30,200);
    o.tx = clamp(LAYOUT.fieldCenter.x+Math.cos(a)*r,80,W-80);
    o.ty = clamp(LAYOUT.fieldCenter.y+Math.sin(a)*r*0.9,240,H-140);
    o.wanderT = rand(1.2,2.8);
  }
  const dx=o.tx-o.x, dy=o.ty-o.y, d=Math.hypot(dx,dy)||1;
  if(d>3){ o.x+=(dx/d)*o.speed*(speedMul||1)*dt; o.y+=(dy/d)*o.speed*(speedMul||1)*dt; o.dirX = dx<0?-1:1; }
}
function updateDog(d, dt, otherDogsClaimBear){
  d.walkPhase += dt*4*(d.speed/36);
  const bear = state.bears.find(b=>!b.falling && !b.caged);
  const alreadyOnThisBear = bear && (d.mode==='chasing'||d.mode==='holding') && d.targetBearId===bear.id;
  const canClaim = bear && !alreadyOnThisBear && d.mode==='wander' && !otherDogsClaimBear(bear.id);
  if(bear && (alreadyOnThisBear || canClaim)){
    if(canClaim){ d.mode='chasing'; d.targetBearId=bear.id; }
    if(d.mode==='chasing'){
      const dx=bear.x-d.x, dy=bear.y-d.y, dd=Math.hypot(dx,dy)||1;
      if(dd>26){ d.x+=(dx/dd)*d.speed*2.3*dt; d.y+=(dy/dd)*d.speed*2.3*dt; d.dirX=dx<0?-1:1; }
      else { d.mode='holding'; bear.heldByDog=true; bear.speed=0; Audio_.bark(); }
    } else if(d.mode==='holding'){
      d.x = bear.x - 30*(d.dirX||1); d.y = bear.y + 6;
      if(bear.caged){ d.mode='wander'; d.targetBearId=null; bear.heldByDog=false; }
    }
    return;
  }
  if(!bear && d.mode!=='wander'){ d.mode='wander'; d.targetBearId=null; }
  if(d.mode==='chasing' || d.mode==='holding') return; // this dog is mid-approach to a bear another dog no longer claims; let it arrive naturally next tick
  wanderMove(d,dt);
}
function updateDogs(dt){
  state.dogs.forEach(d=>{
    const otherClaims = (bearId)=> state.dogs.some(other=>other!==d && (other.mode==='chasing'||other.mode==='holding') && other.targetBearId===bearId);
    updateDog(d, dt, otherClaims);
  });
}
function findCatTarget(forCat){
  const cap=warehouseCap(), used=warehouseUsed();
  const eggClaimed = e => state.cats.some(other=>other!==forCat && other.pickupTarget && other.pickupTarget.kind==='egg' && other.pickupTarget.ref===e);
  const freeEggs = state.groundEggs.filter(e=>!eggClaimed(e));
  if(freeEggs.length>0 && used+SLOT_COST.egg<=cap){
    let nearest=freeEggs[0], bestD=Infinity;
    freeEggs.forEach(e=>{ const dd=dist(forCat.x,forCat.y,e.x,e.y); if(dd<bestD){bestD=dd;nearest=e;} });
    return {kind:'egg', x:nearest.x, y:nearest.y, type:'egg', ref:nearest};
  }
  if(state.factories.powder.built && state.factories.powder.output>0 && used+SLOT_COST.powder<=cap) return {kind:'powder', x:LAYOUT.factPowderSpot.x-55, y:LAYOUT.factPowderSpot.y+15, type:'powder'};
  if(state.factories.bakery.built && state.factories.bakery.output>0 && used+SLOT_COST.cake<=cap) return {kind:'cake', x:LAYOUT.factBakerySpot.x-55, y:LAYOUT.factBakerySpot.y+15, type:'cake'};
  return null;
}
function updateCat(c, dt){
  c.walkPhase += dt*4*(c.speed/36);
  if(c.mode==='wander' || !c.mode){
    const target = findCatTarget(c);
    if(target){ c.mode='toPickup'; c.pickupTarget=target; c.tx=target.x; c.ty=target.y; }
    else { wanderMove(c,dt); return; }
  }
  if(c.mode==='toPickup'){
    const t=c.pickupTarget;
    const dx=t.x-c.x, dy=t.y-c.y, dd=Math.hypot(dx,dy)||1;
    if(dd>14){ c.x+=(dx/dd)*c.speed*1.7*dt; c.y+=(dy/dd)*c.speed*1.7*dt; c.dirX=dx<0?-1:1; }
    else {
      let ok=false;
      if(t.kind==='egg' && t.ref && state.groundEggs.includes(t.ref)){ state.groundEggs = state.groundEggs.filter(e=>e!==t.ref); ok=true; }
      else if(t.kind==='powder' && state.factories.powder.output>0){ state.factories.powder.output--; ok=true; }
      else if(t.kind==='cake' && state.factories.bakery.output>0){ state.factories.bakery.output--; ok=true; }
      c.pickupTarget=null;
      if(ok){ c.carrying=t.type; c.mode='toDeliver'; c.tx=LAYOUT.warehouse.x; c.ty=LAYOUT.warehouse.y+30; Audio_.pop(); }
      else c.mode='wander';
    }
    return;
  }
  if(c.mode==='toDeliver'){
    const dx=c.tx-c.x, dy=c.ty-c.y, dd=Math.hypot(dx,dy)||1;
    if(dd>14){ c.x+=(dx/dd)*c.speed*1.7*dt; c.y+=(dy/dd)*c.speed*1.7*dt; c.dirX=dx<0?-1:1; }
    else { depositToWarehouse(c.carrying); c.carrying=null; c.mode='wander'; Audio_.coin(); }
    return;
  }
}
function updateCats(dt){ state.cats.forEach(c=>updateCat(c,dt)); }

--------------------------------------------------------------------- */
function collectFactoryOutput(type){
  const f=state.factories[type];
  if(f.output<=0) return;
  const outKey = type==='powder'?'powder':'cake';
  const cap=warehouseCap(), used=warehouseUsed();
  const canFit = Math.floor((cap-used)/SLOT_COST[outKey]);
  const move=Math.min(canFit,f.output);
  if(move<=0){ toast('Склад полон!'); Audio_.error(); return; }
  state.warehouse[outKey]+=move; f.output-=move;
  Audio_.coin();
  if(f._modalRefresh && factModalBg.classList.contains('show')) f._modalRefresh();
}

canvas.addEventListener('pointerdown', (e)=>{
  const p = pointerToWorld(e.clientX, e.clientY);

function insidePasture(x,y){
  const dx=(x-LAYOUT.fieldCenter.x)/LAYOUT.fieldRX, dy=(y-LAYOUT.fieldCenter.y)/LAYOUT.fieldRY;
  return dx*dx+dy*dy <= 0.92;
}
function isBlockedZone(x,y){
  if(dist(x,y,LAYOUT.well.x,LAYOUT.well.y)<95) return true;

  if(dist(x,y,LAYOUT.warehouse.x,LAYOUT.warehouse.y)<95) return true;
  if(dist(x,y,LAYOUT.truckHome.x,LAYOUT.truckHome.y)<100) return true;
  if(dist(x,y,LAYOUT.factPowderSpot.x,LAYOUT.factPowderSpot.y)<80) return true;
  if(dist(x,y,LAYOUT.factBakerySpot.x,LAYOUT.factBakerySpot.y)<80) return true;
  for(const p of state.grassPatches){ if(dist(x,y,p.x,p.y)<62) return true; }
  return false;
}
function handleTap(x,y){
  // 1. Bears always take top priority so they're never blocked by other clickable objects
  for(let i=state.bears.length-1;i>=0;i--){
    const b = state.bears[i];
    if(b.falling) continue;
    if(dist(x,y,b.x,b.y-10)<40){ if(b.caged) collectBear(b); else bearTap(b); return; }
  }
  // 2. Well
  if(dist(x,y,LAYOUT.well.x,LAYOUT.well.y-20)<80){ tapWell(); return; }
  // 3. Shelf
  // 3. Ground eggs (laid where the goose was sitting)
  for(let i=0;i<state.groundEggs.length;i++){
    const egg = state.groundEggs[i];
    if(dist(x,y,egg.x,egg.y)<26){ collectGroundEgg(egg); return; }
  }
  // 4. Warehouse
  if(dist(x,y,LAYOUT.warehouse.x,LAYOUT.warehouse.y+10)<80){ openWarehouse(); return; }
  // 5. Truck
  if(dist(x,y,truckDrawX(),LAYOUT.truckHome.y)<90){ openTruck(); return; }
  // 6. Factory output clusters (collect without opening modal)
  if(state.factories.powder.output>0 && dist(x,y,LAYOUT.factPowderSpot.x-55,LAYOUT.factPowderSpot.y+15)<34){ collectFactoryOutput('powder'); return; }
  if(state.factories.bakery.output>0 && dist(x,y,LAYOUT.factBakerySpot.x-55,LAYOUT.factBakerySpot.y+15)<34){ collectFactoryOutput('bakery'); return; }
  // 7. Factory buildings
  if(dist(x,y,LAYOUT.factPowderSpot.x,LAYOUT.factPowderSpot.y)<60){ tapFactory('powder'); return; }
  if(dist(x,y,LAYOUT.factBakerySpot.x,LAYOUT.factBakerySpot.y)<60){ tapFactory('bakery'); return; }
  // 8. Existing grass patches (no-op, just avoid re-planting on top)
  for(const p of state.grassPatches){ if(dist(x,y,p.x,p.y)<34) return; }
  // 9. Geese (pet)
  for(let i=0;i<state.geese.length;i++){
    const g = state.geese[i];
    if(dist(x,y,g.x,g.y-6)<24){ Audio_.quack(); return; }
  }
  // 10. Plant new grass patch on empty pasture ground
  if(insidePasture(x,y) && !isBlockedZone(x,y)){ plantGrass(x,y); }
}
function truckDrawX(){ return state.truck.x || LAYOUT.truckHome.x; }
function tapWell(){
  if(state.pumping) return;
  if(state.water>=10) return;
  state.pumping = true; Audio_.pump();
}
function plantGrass(x,y){
  if(!state.wellReady || state.water<=0){ toast('Наберите полное ведро воды!'); Audio_.error(); return; }
  if(state.grassPatches.length>=14){ toast('Слишком много травы на поле!'); return; }
  // Grass sprouts instantly, fully grown, as a small round patch of watered earth.
  // A bush is a single serving — one goose eating it makes it vanish immediately.
  state.grassPatches.push({x,y,amount:1,maxAmount:1,id:Math.random()});
  state.water -= 1;
  if(state.water<=0){ state.water=0; state.wellReady=false; }
  Audio_.splash();
  floatIcon(x,y-30,'water',null);
}

const truckModalBg = document.getElementById('truckModalBg');
document.getElementById('truckClose').onclick = ()=>{
  // Closing without sending refunds whatever was loaded back to the warehouse,
  // so nothing gets accidentally "lost" in the truck.
  const t = state.truck;
  if(!t.busy){
    state.warehouse.eggs += t.cargo.eggs;
    state.warehouse.bears += t.cargo.bears;
    state.warehouse.powder += t.cargo.powder;
    state.warehouse.cake += t.cargo.cake;
    t.cargo = {eggs:0,bears:0,powder:0,cake:0};
  }

function openTruck(){
  if(state.truck.busy) return;
  renderTruck(); openModal(truckModalBg); state.truck.trunkOpen = true;
}
function truckCargoSlots(){
  const t=state.truck.cargo;
  return t.eggs*SLOT_COST.egg + t.bears*SLOT_COST.bear + t.powder*SLOT_COST.powder + t.cake*SLOT_COST.cake;
}
function renderTruck(){
  const t = state.truck; const cap = TRUCK_CAP_PER_LEVEL[t.level];
  renderSegmentedBar(document.getElementById('truckCapFill'), t.cargo, cap);
  document.getElementById('truckCapLabel').textContent = truckCargoSlots()+'/'+cap+' мест';

  rows.innerHTML='';
  const items = [
    {key:'eggs', label:'Яйца', icon:'egg', price:PRICES.egg, avail:state.warehouse.eggs, slot:SLOT_COST.egg},
    {key:'bears', label:'Медведи', icon:'bear', price:PRICES.bear, avail:state.warehouse.bears, slot:SLOT_COST.bear},
    {key:'powder', label:'Яичный порошок', icon:'powder', price:PRICES.powder, avail:state.warehouse.powder, slot:SLOT_COST.powder},
    {key:'cake', label:'Кексы', icon:'cake', price:PRICES.cake, avail:state.warehouse.cake, slot:SLOT_COST.cake},
  ];
  items.forEach(it=>{
    const row = document.createElement('div'); row.className='row';
    const iconCanvas = document.createElement('canvas'); iconCanvas.width=76; iconCanvas.height=76;
    drawIcon(iconCanvas, it.icon);
    const infoDiv = document.createElement('div'); infoDiv.className='info';
    infoDiv.appendChild(iconCanvas);
    const lbl = document.createElement('div');
    lbl.innerHTML = `<div class="lbl">${it.label} — ${it.price}<span class="coinIcon" style="width:12px;height:12px;vertical-align:-1px;margin-left:2px;"></span></div><div class="sub">на складе: ${it.avail}</div>`;
    infoDiv.appendChild(lbl);
    row.appendChild(infoDiv);
    const stepDiv = document.createElement('div'); stepDiv.className='stepBtns';
    const minus = document.createElement('div'); minus.className='stepBtn'; minus.textContent='−';
    const qty = document.createElement('div'); qty.className='qty'; qty.textContent = t.cargo[it.key];
    const plus = document.createElement('div'); plus.className='stepBtn'; plus.textContent='+';
    minus.onclick = ()=>{ if(t.cargo[it.key]>0){ t.cargo[it.key]--; state.warehouse[it.key]++; Audio_.click(); renderTruck(); renderIfOpen(); } };
    plus.onclick = ()=>{
      const cap2 = TRUCK_CAP_PER_LEVEL[t.level];
      const wouldUse = truckCargoSlots()+it.slot;
      if(state.warehouse[it.key]<=0){ Audio_.error(); return; }
      if(wouldUse>cap2){ toast('Машина заполнена!'); Audio_.error(); return; }
      t.cargo[it.key]++; state.warehouse[it.key]--; Audio_.click(); renderTruck(); renderIfOpen();
    };
    stepDiv.appendChild(minus); stepDiv.appendChild(qty); stepDiv.appendChild(plus);
    row.appendChild(stepDiv);
    rows.appendChild(row);
  });

  ic.save(); ic.translate(canvasEl.width/2, canvasEl.height/2); drawSpeakerIcon(ic,on); ic.restore();
}
document.getElementById('soundToggleBtn').onclick = ()=>{ state.soundOn=!state.soundOn; Audio_.setEnabled(state.soundOn); refreshMuteIcons(); };
document.getElementById('muteBtn').onclick = ()=>{ state.soundOn=!state.soundOn; Audio_.setEnabled(state.soundOn); refreshMuteIcons(); };
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('Точно начать заново? Весь прогресс будет потерян.')){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} location.reload(); }
};

/* ---------------------------------------------------------------------
   SAVE / LOAD
--------------------------------------------------------------------- */
function saveGame(){
  try{
    const data = {
      coins: state.coins, gooseCost: state.gooseCost, gooseCount: state.geese.length,
      water: state.water, wellReady: state.wellReady,
      grassPatches: state.grassPatches.map(p=>({x:p.x,y:p.y,amount:p.amount})),
      groundEggs: state.groundEggs.map(e=>({x:e.x,y:e.y})), dogsCount: state.dogs.length, catsCount: state.cats.length,
      warehouse: state.warehouse,
      truck: { level: state.truck.level },
      factories: {
        powder: { built: state.factories.powder.built, output: state.factories.powder.output },
        bakery: { built: state.factories.bakery.built, output: state.factories.bakery.output }
      },
      soundOn: state.soundOn,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    state.coins = d.coins ?? state.coins;
    state.gooseCost = d.gooseCost ?? state.gooseCost;
    state.water = d.water ?? 0;
    state.wellReady = !!d.wellReady;
    state.grassPatches = Array.isArray(d.grassPatches) ? d.grassPatches.map(p=>({x:p.x,y:p.y,amount:p.amount,maxAmount:1,id:Math.random()})) : [];
    state.groundEggs = Array.isArray(d.groundEggs) ? d.groundEggs.map(e=>({x:e.x,y:e.y,id:Math.random()})) : [];
    const dogsCount = d.dogsCount ?? (d.hasDog?1:0);
    const catsCount = d.catsCount ?? (d.hasCat?1:0);
    state.dogs = []; for(let i=0;i<dogsCount;i++) state.dogs.push(makeCompanion());
    state.cats = []; for(let i=0;i<catsCount;i++) state.cats.push(makeCompanion());
    if(d.warehouse) Object.assign(state.warehouse, d.warehouse);
    if(d.truck && d.truck.level) state.truck.level = d.truck.level;
    if(d.factories){
      if(d.factories.powder){ state.factories.powder.built = !!d.factories.powder.built; state.factories.powder.output = d.factories.powder.output||0; }
      if(d.factories.bakery){ state.factories.bakery.built = !!d.factories.bakery.built; state.factories.bakery.output = d.factories.bakery.output||0; }
    }
    state.soundOn = d.soundOn !== false;
    Audio_.setEnabled(state.soundOn);
    const gCount = d.gooseCount || 2;
    for(let i=0;i<gCount;i++) spawnGoose();
    return true;
  }catch(e){ return false; }
}

/* ---------------------------------------------------------------------
   MAIN UPDATE LOOP
--------------------------------------------------------------------- */
let lastT = performance.now();
let truckAnimState = 'home';
function updateWell(dt){
  if(state.pumping){
    state.water += dt*2.6;
    if(state.water>=10){ state.water=10; state.pumping=false; state.wellReady=true; }
  }
}
function updateGrassPatches(dt){
  // Grass sprouts instantly when planted, so nothing to grow over time here anymore.
}
function updateFactories(dt){
  ['powder','bakery'].forEach(type=>{
    const f = state.factories[type];
    if(f.producing){
      f.prog += dt;
      if(f.prog>=f.dur){ f.producing=false; f.prog=0; f.output=Math.min(f.outCap,f.output+1); Audio_.pop(); }
      if(f._modalRefresh && factModalBg.classList.contains('show')) f._modalRefresh();
    }
  });
}
function updateTruck(dt){
  const t = state.truck; const homeX = LAYOUT.truckHome.x;
  if(t.busy){
    if(truckAnimState==='home'){ truckAnimState='leaving'; t.dirX=1; }
    if(truckAnimState==='leaving'){
      t.x = (t.x||homeX) + dt*260;
      if(t.x>LAYOUT.truckGoneX){ truckAnimState='gone'; t.goneTimer = 1.1; t.trunkOpen=false; }
    } else if(truckAnimState==='gone'){
      t.goneTimer -= dt;
      if(t.goneTimer<=0){ truckAnimState='returning'; t.dirX=-1; t.x = LAYOUT.truckGoneX+140; }
    } else if(truckAnimState==='returning'){
      t.x = Math.max(homeX, t.x - dt*260);
      if(t.x<=homeX+2){
        t.x = homeX; truckAnimState='home'; t.busy = false; t.dirX=1;
        t.cargo = {eggs:0,bears:0,powder:0,cake:0};
        const rev = t.pendingRevenue||0;
        state.coins += rev; updateCoinUI();
        if(rev>0){ floatCoins(LAYOUT.truckHome.x, LAYOUT.truckHome.y-60, rev); Audio_.coinBig(); }
      }
    }
  } else { t.x = homeX; t.dirX=1; }
}
function tickBearSpawns(now){
  if(now > state.spawnBearAt && state.bears.length===0){
    spawnBear(); state.spawnBearAt = now + rand(20000,34000);
  }
}
function update(dt, now){
  updateWell(dt); updateGrassPatches(dt); updateFactories(dt); updateTruck(dt);
  updateTumbles(dt); updateDust(dt);
  state.geese.forEach(g=>updateGoose(g,dt));
  const diedGeese = state.geese.filter(g=>g.dead);
  if(diedGeese.length){ diedGeese.forEach(g=>spawnGooseTumble(g.x,g.y)); state.geese = state.geese.filter(g=>!g.dead); }
  state.bears.forEach(b=>updateBear(b,dt));
  updateDogs(dt);
  updateCats(dt);
  tickBearSpawns(now);
  updateWaterUI();
}

/* ---------------------------------------------------------------------
   RENDER
--------------------------------------------------------------------- */
function render(){
  ctx.save(); ctx.scale(scaleX, scaleY); ctx.clearRect(0,0,W,H);
  drawBackground();
  drawWell(ctx, state.water);
  state.grassPatches.forEach(p=>drawGrassPatch(ctx,p));
  drawFactory(ctx,'powder', state.factories.powder.built, state.factories.powder.producing, state.factories.powder.prog/state.factories.powder.dur);
  drawFactory(ctx,'bakery', state.factories.bakery.built, state.factories.bakery.producing, state.factories.bakery.prog/state.factories.bakery.dur);
  drawFactoryOutputCluster(ctx,'powder'); drawFactoryOutputCluster(ctx,'bakery');
  state.groundEggs.forEach(e=>drawGroundEgg(ctx,e));
  drawWarehouse(ctx, state.warehouse.capLevel);
  drawDust();

  const entities = [];
  state.geese.forEach(g=>entities.push({type:'goose', o:g, y:g.y}));
  state.bears.forEach(b=>entities.push({type:'bear', o:b, y: b.falling? b.landY-1 : b.y}));
  state.dogs.forEach(d=>entities.push({type:'dog', o:d, y:d.y}));
  state.cats.forEach(c=>entities.push({type:'cat', o:c, y:c.y}));
  entities.sort((a,b)=>a.y-b.y);
  entities.forEach(e=>{
    if(e.type==='bear' && e.o.falling){
      ctx.save(); ctx.globalAlpha=0.25; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(e.o.x,e.o.landY,26,10,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(e.o.x, e.o.y); ctx.rotate(clamp(e.o.fallVel/900,0,1)*0.5);
      drawBear(ctx,1.15,0,0,0); ctx.restore();
      return;
    }
    ctx.save(); ctx.translate(e.o.x, e.o.y);
    if(e.type==='goose'){
      drawGoose(ctx,1.15,e.o.walkPhase,e.o.dirX);
      if(e.o.hunger<70){ ctx.restore(); drawHungerBar(e.o.x-13,e.o.y-36,e.o.hunger); ctx.save(); ctx.translate(e.o.x,e.o.y); }
    }
    else if(e.type==='bear') drawBear(ctx,1.15,e.o.walkPhase, e.o.cageStage, e.o.heldByDog?1:0);
    else if(e.type==='dog') drawDog(ctx,1.3,e.o.walkPhase,e.o.dirX);
    else if(e.type==='cat'){
      drawCat(ctx,1.3,e.o.walkPhase,e.o.dirX);
      if(e.o.carrying){
        ctx.save(); ctx.translate(0,-19);
        if(e.o.carrying==='egg') drawEgg(ctx,1.1);
        else if(e.o.carrying==='powder') { ctx.scale(0.45,0.45); drawPowderIcon(ctx,1); }
        else if(e.o.carrying==='cake') { ctx.scale(0.45,0.45); drawCakeIcon(ctx,1); }
        ctx.restore();
      }
    }
    ctx.restore();
  });
  drawTumbles();

  ctx.save();
  const tx = state.truck.x || LAYOUT.truckHome.x;
  ctx.translate(tx, LAYOUT.truckHome.y);
  ctx.scale(state.truck.dirX||1, 1);
  const wheelSpin = performance.now()/120;
  drawTruckBody(ctx, state.truck.level, state.truck.trunkOpen);
  drawTruckCargo(ctx, state.truck.cargo, state.truck.level, state.truck.trunkOpen);
  drawTruckWheels(ctx, state.truck.level, state.truck.busy? wheelSpin:0);
  ctx.restore();

  ctx.restore();
}

/* ---------------------------------------------------------------------
   UI refresh
--------------------------------------------------------------------- */
let bucketDotEls = [];
function updateCoinUI(){
  document.getElementById('coinVal').textContent = fmt(state.coins);
  Array.from(shopRow.children).forEach(btn=> btn._refresh && btn._refresh());
  document.getElementById('whQuick').textContent = warehouseUsed()+'/'+warehouseCap();
}
function updateWaterUI(){
  document.getElementById('waterVal').textContent = Math.floor(state.water)+'/10';
  const filled = Math.floor(state.water);
  bucketDotEls.forEach((el,i)=> el.classList.toggle('filled', i<filled));
  document.getElementById('waterPill').classList.toggle('ready', state.wellReady && state.water>0);
}

/* ---------------------------------------------------------------------
   MAIN LOOP
--------------------------------------------------------------------- */
let saveTimer = 0;
function loop(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  update(dt, now);
  render();
  saveTimer += dt;
  if(saveTimer>4){ saveTimer=0; saveGame(); updateCoinUI(); }
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */
function init(){
  buildShop();
  const bd = document.getElementById('bucketDots');
  bd.innerHTML='';
  for(let i=0;i<10;i++){ const s=document.createElement('span'); bd.appendChild(s); bucketDotEls.push(s); }
  document.getElementById('waterPill').onclick = tapWell;
  drawIcon(document.getElementById('waterIconCanvas'),'water');
  drawIcon(document.getElementById('whQuickIcon'),'warehouse');
  drawIcon(document.getElementById('truckTitleIcon'),'truck');
  drawIcon(document.getElementById('whTitleIcon'),'warehouse');
  refreshMuteIcons();

  const had = loadGame();
  if(!had){ spawnGoose(); spawnGoose(); }
  updateCoinUI(); updateWaterUI(); renderWarehouse();
  requestAnimationFrame(loop);
}

(function(){
  const sc = document.getElementById('startGooseCanvas');
  const sctx = sc.getContext('2d');
  let ph=0;
  function anim(){
    sctx.clearRect(0,0,160,160);
    sctx.save(); sctx.translate(80,110); sctx.scale(2.2,2.2);
    drawGoose(sctx,1, ph, 1);
    sctx.restore();
    ph+=0.06;
    if(document.getElementById('startScreen').style.display!=='none') requestAnimationFrame(anim);
  }
  anim();
})();

document.getElementById('startBtn').addEventListener('click', ()=>{
  Audio_.unlock();
  document.getElementById('startScreen').style.display='none';
  init();
});
</script>
